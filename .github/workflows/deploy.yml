name: Deploy to Cloudflare Pages

# Auto-deploys the site to Cloudflare Pages on every push to master.
# Requires one repo secret: CLOUDFLARE_API_TOKEN (a Cloudflare API token with the
# "Cloudflare Pages — Edit" permission). The account ID below is not secret.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 08db37eaa49d32852b57069a25683dfb
          command: pages deploy dist --project-name=prela-automobile --branch=master
